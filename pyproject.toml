[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-alert-triage-eval"
version = "0.1.0"
description = "Evaluation harness for LLM-assisted SIEM alert triage"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Shubham Mane"}]
dependencies = [
  "httpx==0.28.1",
  "matplotlib==3.11.2",
  "openai==3.19.2",
  "pandas==3.0.6",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
triage-eval = "triage_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["triage_eval"]
