name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: mypy src/triage_eval
      - run: pytest
      - run: python scripts/check_secrets.py
      - name: Assert ignored data and secrets are absent
        run: |
          test ! -e data
          test ! -e .env
